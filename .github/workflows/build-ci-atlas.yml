name: Atlas CI

on:
  push:
    branches:
      - '[0-9]+.[0-9x]+'
  pull_request:
    branches:
      - '[0-9]+.[0-9x]+'
      - feature/*

jobs:
  build:
    # The mongodb-atlas-local image embeds the same MongoDB 8.0 startup check:
    # the ubuntu-24.04 runner reports kernel 7.0.0-1017-azure, which it rejects
    # (SERVER-136848). ubuntu-22.04 (kernel 6.8) is below the cutoff, but it is
    # deprecated since 2026-09-17 and unsupported after 2027-04-17. Move back
    # once the image ships MongoDB 8.0.35 or later, which reads
    # /proc/version_signature on Ubuntu (SERVER-131779).
    runs-on: ubuntu-22.04

    name: PHP/${{ matrix.php }} Laravel/${{ matrix.laravel }} Driver/${{ matrix.driver }}

    services:
      mongodb:
        image: mongodb/mongodb-atlas-local:latest
        env:
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          EMBEDDING_PROVIDER_ENDPOINT: https://api.voyageai.com/v1/embeddings
        ports:
          - 27017:27017

    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['12.*', '13.*']
        driver: [2]
        include:
          - php: '8.4'
            laravel: 12.*
            driver: 1
        exclude:
          - laravel: '13.*'
            php: '8.2'

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP with MongoDB extension
        uses: ./.github/actions/setup-php
        with:
          php-version: ${{ matrix.php }}
          driver: ${{ matrix.driver }}
          extensions: curl,mbstring,xdebug
          coverage: xdebug

      - name: Show Docker version
        if: ${{ runner.debug }}
        run: docker version && env

      - name: Restrict Laravel version
        run: composer require --dev --no-update 'laravel/framework:${{ matrix.laravel }}'

      - name: Download Composer cache dependencies from cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ matrix.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ matrix.os }}-composer-

      - name: Install dependencies
        run: |
          composer update --no-interaction

      - name: Run tests
        run: |
          export MONGODB_URI="mongodb://127.0.0.1:27017/?directConnection=true"
          php -d zend.assertions=1 ./vendor/bin/phpunit --coverage-clover coverage.xml --group atlas-search
